<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Themen — claude.christian-grafe.de</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#eef1f6">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0c11">
<!-- Sperrseite fuer /thema/. Sie steht hier nur, damit Apache das Verzeichnis
     nicht auflistet: die einzelnen Themenseiten sind zum Verschicken gedacht,
     ihre Gesamtliste geht niemanden etwas an. Deshalb absichtlich ohne
     Aufzaehlung und ohne Verweis auf ein Dashboard.
     Quelle: ~/claude/dashboard/thema-index.html -->
<style>
  :root{
    color-scheme:light dark;
    --bg:#eef1f6; --surface:#ffffff; --text:#12151c; --muted:#5b6472; --border:#dde2ea;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0a0c11; --surface:#12151d; --text:#e8eaf0; --muted:#8e97a8; --border:#232838; }
  }
  body{
    margin:0; min-height:100vh; display:grid; place-items:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text); line-height:1.6; padding:1.5rem;
  }
  main{max-width:34ch; text-align:center;}
  h1{font-size:1.3rem; margin:0 0 .6rem; letter-spacing:-.01em;}
  p{margin:0 0 1.4rem; color:var(--muted); font-size:.95rem;}
  a{
    display:inline-block; text-decoration:none; font-weight:600; color:var(--text);
    background:var(--surface); border:1px solid var(--border);
    border-radius:999px; padding:.5rem 1rem; font-size:.9rem;
  }
</style>
</head>
<body>
<main>
  <h1>Nichts zu sehen 📊</h1>
  <p>Hier liegen einzelne Themenseiten. Jede hat ihre eigene Adresse — die
     bekommt man geschickt, man findet sie nicht hier.</p>
  <a href="https://claude.christian-grafe.de">claude.christian-grafe.de</a>
</main>
</body>
</html>
